<!doctype html>
<html>
  <head lang="en">
    <title>Workspace Key</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Slot">
      <sdpi-select setting="slotIndex" default="0">
        <option value="0">Workspace 1</option><option value="1">Workspace 2</option><option value="2">Workspace 3</option><option value="3">Workspace 4</option>
        <option value="4">Workspace 5</option><option value="5">Workspace 6</option><option value="6">Workspace 7</option><option value="7">Workspace 8</option>
        <option value="8">Workspace 9</option><option value="9">Workspace 10</option><option value="10">Workspace 11</option><option value="11">Workspace 12</option>
        <option value="12">Workspace 13</option><option value="13">Workspace 14</option><option value="14">Workspace 15</option><option value="15">Workspace 16</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="">
      <p style="margin: 0; font-size: 8pt; color: #969696">Workspaces are ordered by host, then by their Herdr number. Press to switch that host's Herdr to the workspace.</p>
    </sdpi-item>
  </body>
</html>
