<!doctype html>
<html>
  <head lang="en">
    <title>Inbox Key</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Slot">
      <sdpi-select setting="slotIndex" default="0">
        <option value="0">Slot 1</option>
        <option value="1">Slot 2</option>
        <option value="2">Slot 3</option>
        <option value="3">Slot 4</option>
        <option value="4">Slot 5</option>
        <option value="5">Slot 6</option>
        <option value="6">Slot 7</option>
        <option value="7">Slot 8</option>
        <option value="8">Slot 9</option>
        <option value="9">Slot 10</option>
        <option value="10">Slot 11</option>
        <option value="11">Slot 12</option>
        <option value="12">Slot 13</option>
        <option value="13">Slot 14</option>
        <option value="14">Slot 15</option>
        <option value="15">Slot 16</option>
        <option value="16">Slot 17</option>
        <option value="17">Slot 18</option>
        <option value="18">Slot 19</option>
        <option value="19">Slot 20</option>
        <option value="20">Slot 21</option>
        <option value="21">Slot 22</option>
        <option value="22">Slot 23</option>
        <option value="23">Slot 24</option>
        <option value="24">Slot 25</option>
        <option value="25">Slot 26</option>
        <option value="26">Slot 27</option>
        <option value="27">Slot 28</option>
        <option value="28">Slot 29</option>
        <option value="29">Slot 30</option>
        <option value="30">Slot 31</option>
        <option value="31">Slot 32</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Layout">
      <sdpi-select setting="layout" default="paged">
        <option value="paged">Paged (Stream Deck +, follows the scroll dial)</option>
        <option value="wall">Wall (one key per agent, no paging)</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Label">
      <sdpi-select setting="display" default="title">
        <option value="title">Pane title</option>
        <option value="project">Project folder</option>
      </sdpi-select>
    </sdpi-item>
    <!-- Ops address is global: every LCARS key shares one daemon. -->
    <sdpi-item label="Ops address">
      <sdpi-textfield setting="opsUrl" global placeholder="http://127.0.0.1:7677 (default)"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="">
      <p style="margin: 0; font-size: 8pt; color: #969696">
        Keys stay dark until Ops is running: <code>cd packages/ops &amp;&amp; cargo run</code>.
      </p>
    </sdpi-item>
  </body>
</html>
