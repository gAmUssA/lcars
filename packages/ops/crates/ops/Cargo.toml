[package]
name = "ops"
description = "LCARS Ops: merges Herdr socket state from every host for the Stream Deck plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ops"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# Herdr protocol 22 schema types, vendored by kcosr/herdr-web. Pinned to a commit; bump by hand
# after re-running the drift check in docs/herdr-api.md against the live `herdr api schema --json`.
herdr-compat = { git = "https://github.com/kcosr/herdr-web", rev = "92717f433b00881724b7f8bff328fb07d9fceab6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "signal", "fs"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
